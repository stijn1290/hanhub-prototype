<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat</title>

    <link rel="stylesheet" href="../style/style.css">
</head>

<body>

<main class="chat-page">

    <!-- Chat Header -->
    <header class="chat-header">

        <button class="back-button" aria-label="Go back">
            ←
        </button>

        <div class="user-info">
            <img
                    src="../images/profile.jpg"
                    alt="Profile picture"
                    class="profile-picture"
            >

            <div class="user-details">
                <h1>humberto tan</h1>
                <span>Active 11m ago</span>
            </div>
        </div>

        <div class="header-actions">
            <button aria-label="Call">
                📞
            </button>

            <button aria-label="Video call">
                📹
            </button>
        </div>

    </header>


    <!-- Messages -->
    <section class="messages">

        <!-- Sent message -->
        <div class="message message-sent">
            <p>dit is de chat template</p>
        </div>


        <!-- Date separator -->
        <div class="date-separator">
            Nov 30, 2023, 9:41 AM
        </div>


        <!-- Received messages -->
        <div class="message-group message-received">

            <img
                    src="../images/profile.jpg"
                    alt=""
                    class="message-avatar"
            >

            <div class="message-bubbles">
                <div class="message">
                    <p>Oh?</p>
                </div>

                <div class="message">
                    <p>Cool</p>
                </div>

                <div class="message">
                    <p>wat</p>
                </div>
            </div>

        </div>


        <!-- Sent messages -->
        <div class="message-group message-sent">

            <div class="message">
                <p>dit gesprek loopt goed</p>
            </div>

            <div class="message">
                <p>Boom!</p>
            </div>

        </div>


        <!-- Received messages -->
        <div class="message-group message-received">

            <img
                    src="../images/profile.jpg"
                    alt=""
                    class="message-avatar"
            >

            <div class="message-bubbles">
                <div class="message">
                    <p>Hmmm</p>
                </div>

                <div class="message">
                    <p>mooi gezegd</p>
                </div>

                <div class="message">
                    <p>dag</p>
                </div>
            </div>

        </div>

    </section>


    <!-- Message Input -->
    <footer class="chat-input">

        <input
                type="text"
                placeholder="Message..."
                aria-label="Message"
        >

        <button aria-label="Voice message">
            🎤
        </button>

        <button aria-label="Emoji">
            ☺
        </button>

        <button aria-label="Upload image">
            🖼
        </button>

    </footer>

</main>

</body>

</html>
