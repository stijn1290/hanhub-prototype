<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Maak een account aan</title>

    <link rel="stylesheet" href="../style/style.css">
    <link rel="icon" type="image/png" href="../images/hanhub.png">
</head>

<body>

<main class="signup-page">

    <div class="background-overlay"></div>

    <section class="signup-content">

        <img
                src="../images/hanhub.png"
                alt="HAN Hub"
                class="signup-logo"
        >

        <div class="signup-heading">
            <h1>Maak een account aan</h1>
            <p>Voer je e-mailadres in om je<br>aan te melden voor deze app.</p>
        </div>

        <form class="signup-form">

            <input
                    type="email"
                    placeholder="email@domain.com"
            >

            <button onclick="window.location.href = '../index.html'" type="button" class="continue-button">
                Doorgaan
            </button>

            <div class="divider">
                <span></span>
                <p>of</p>
                <span></span>
            </div>

            <button onclick="window.location.href = '../index.html'" type="button" class="han-button">
                Ga verder met <strong>HAN_</strong>
            </button>

        </form>

        <p class="terms">
            Door op doorgaan te klikken, gaat u akkoord met onze
            <strong>Servicevoorwaarden</strong> en ons
            <strong>Privacybeleid.</strong>
        </p>

    </section>

    <p class="social-text">
        Je hoeft niet social te zijn om social contact te krijgen.
    </p>

</main>

</body>
</html>
