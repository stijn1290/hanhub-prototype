<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Home</title>

    <link rel="stylesheet" href="style/style.css">
    <link rel="icon" type="image/png" href="images/hanhub.png">

    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

<div class="home-page">
    <!-- Content -->
    <main class="home-content">

        <!-- Search -->
        <div class="home-search">
            <i data-lucide="search"></i>

            <input
                    type="text"
                    placeholder="Zoeken..."
            >
        </div>


        <!-- Actions -->
        <div class="home-actions">

            <a href="pages/chat.html" class="home-action">
                <i data-lucide="heart"></i>
                <span>Berichten</span>
            </a>

            <button class="home-action">
                <i data-lucide="history"></i>
                <span>Studentinformatie</span>
            </button>

        </div>


        <!-- Hero -->
        <div class="home-hero">
            <img
                    src="images/campus.png"
                    alt="Studenten"
            >
        </div>


        <!-- Apps -->
        <section class="home-section">

            <div class="home-section-header">
                <h2>Apps</h2>

                <button class="home-section-arrow">
                    <i data-lucide="chevron-right"></i>
                </button>
            </div>

            <div class="home-horizontal-list">

                <a href="#" class="home-app-item">

                    <div class="home-app-icon">
                        <img src="images/outlook.png" alt="" width="100" height="100">
                    </div>

                    <span>Mail</span>

                </a>


                <a href="#" class="home-app-item">

                    <div class="home-app-icon">
                        <img src="images/maps.png" alt="" width="100" height="70">
                    </div>

                    <span>Kaart</span>

                </a>


                <a href="#" class="home-app-item">

                    <div class="home-app-icon">
                        <img src="images/teams.png" alt="" width="100" height="70">
                    </div>

                    <span>Teams</span>
                </a>


                <a href="#" class="home-app-item">

                    <div class="home-app-icon brightspace">
                        <img src="images/brightspace.png" alt="" width="100" height="70">
                    </div>

                    <span>Brightspace</span>

                </a>

            </div>

        </section>


        <!-- Studentenzaken -->
        <section class="home-section">

            <div class="home-section-header">
                <h2>Studentenzaken</h2>

                <button class="home-section-arrow">
                    <i data-lucide="chevron-right"></i>
                </button>
            </div>


            <div class="home-horizontal-list">

                <a href="#" class="home-app-item">

                    <div class="home-service-icon">
                        <img src="images/ssh.png" alt="" width="50" height="70">
                    </div>

                    <span>
                        Studenten<br>
                        woning
                    </span>

                </a>


                <a href="#" class="home-app-item">

                    <div class="home-service-icon">
                        <img src="images/osiris.png" alt="" width="70" height="70">
                    </div>

                    <span>Osiris</span>

                </a>


                <a href="#" class="home-app-item">

                    <div class="home-service-icon">
                        <img src="images/isas.png" alt="" width="70" height="40">
                    </div>

                    <span>Isas</span>

                </a>


                <a href="#" class="home-app-item">

                    <div class="home-service-icon">
                        <img src="images/myx.png" alt="" width="80" height="60">
                    </div>

                    <span>Rooster</span>

                </a>

            </div>

        </section>

    </main>


    <!-- Bottom navigation -->
    <nav class="home-bottom-nav">

        <a href="#" class="home-nav-item active">
            <i data-lucide="house"></i>
        </a>

        <a href="#" class="home-nav-item">
            <i data-lucide="search"></i>
        </a>

        <a href="pages/chat.html" class="home-nav-item">
            <i data-lucide="message-circle-more"></i>
        </a>

        <a href="#" class="home-nav-item">
            <i data-lucide="graduation-cap"></i>
        </a>

        <a href="#" class="home-nav-item">
            <i data-lucide="bell"></i>
        </a>

        <a href="#" class="home-nav-item profile">
            <img src="images/profile-image.svg" alt="Profiel">
        </a>

    </nav>
</div>


<script>
    lucide.createIcons();
</script>

</body>
</html>
